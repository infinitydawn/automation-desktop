# DMP job for dmp_job.py. Drag this file onto build_job.bat (or: python dmp_job.py build "<this file>").
# Anything left blank or left out keeps the template's value.

[job]
# Existing Remote Link export to copy everything else from (System Options, Areas, Profiles, Users, ...)
template = ../v1 - test job.xml
# Where to write the new job. Default: "<panel name>.xml" next to this file.
output = 123 Example St.xml
# Optional: zone list file instead of / in addition to [zones] below (.csv: number,name,out  or .txt: "1 PULL STATION")
# zones = zones.csv

[panel]
name = 123 Example St
customer = 123 Example St
region = Brooklyn
account = 1234
address = 123 Example St
city = Brooklyn
state = NY
zip = 11201
ip = 192.168.1.100
# Serial number / MAC address from the template panel are cleared unless keep_serial = yes
# keep_serial = no

[comm]
# Account defaults to the panel account. Type phone numbers digits only.
first_phone = 555
second_phone = 555
test_time = 10:00 AM
transmit_delay = 0

[outputs]
# Output Information names. Leave this section out to keep the template's outputs.
1 = DAMPER TOP OF STAIRS

[zones]
# number = NAME          type/messages come from the name (Device Cheat Sheet - Fire)
# extras after |  :  out=N (AS output N, Steady)   type=FI/SV   ao=A/T   as=A/T
1 = PULL STATION BY FACP
2 = MAIN&B4 VALVE 1FL SPRINKLER RM
3 = B4&AFTER BACKFLOW 1FL SPRINKLER
4 = B4&AFTER DOMESTIC 1FL SPRKLR RM
5 = WATERFLOW 1FL SPRKLR RM
6 = HEAT DET 1FL HOT WATER TANK RM
7 = HEAT DET 1FL HWH RM
8 = RADIO TROUBLE
9 = SMOKE DET 1FL ELEC&SPRKLR RM
10 = SMOKE DET 1FL LOW VOLT&DOMESTIC
501 = SMOKE DET ROOF TOP OF STAIRS | out=1
